name: Mirror to personal repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to personal repository
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b mirror
          git rm -r --cached .github > /dev/null
          rm -rf .github
          git commit -m "Remove CI workflows from mirror" --allow-empty
          git remote add personal "https://x-access-token:${PERSONAL_REPO_TOKEN}@github.com/Jlim01/Glocal-Investment.git"
          git push --force personal mirror:main
